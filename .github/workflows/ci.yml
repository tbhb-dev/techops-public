---
# Main quality gate. techops-public is a Go, Python, and TypeScript monorepo with
# one Go binary so far, so the gates are the full lint bar, the Go tests
# (coverage threshold plus the race detector, on Linux and macOS), the
# bats suites for the shell tools, the Python checks, and govulncheck.
# Every job installs the pinned toolchain through mise and runs its gate
# through `mise run`, so the mise config stays the single definition of
# what each gate runs. The local `check` aggregate stays in lockstep with
# this workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared devtools lint workflow reports as `lint / lint`. It checks the
  # vendored payload, syncs the Vale styles, installs guard-markdown, and
  # runs `mise run lint`, so this repository keeps supplying those tasks.
  lint:
    permissions:
      contents: read
    uses: tbhb-dev/devtools/.github/workflows/consumer-lint.yml@8dff05b148c3a468dbf0e6e8fb48092bd5cbb418 # v0.18.0

  # The tree scan in `lint` sees only the checkout. This reads every
  # commit, message, and author line the pull request adds, so a value
  # committed and removed again within the branch still fails. CI has no
  # private literals, so this runs the publishable patterns only.
  leak-range:
    name: leak-range
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Full history: the range scan reads every commit a pull request
      # adds, and a shallow clone is refused as incomplete.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      - name: Scan the pull request for leaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Scan source commits rather than GitHub's synthetic merge signature.
        run: mise run devtools:lint-leaks -- --range "${BASE_SHA}..${HEAD_SHA}"

  test-tools:
    name: test-tools
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs every tool the mise config pins, bats included.
      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19

      - name: Test the shell tools
        run: |
          mise run test-vendored
          mise run test-tools

  test-matrix:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The first `mise run` in a job otherwise installs the whole
      # configured toolchain rather than the task's own tools. Turning the
      # auto-install off leaves install_args as the single place naming what
      # this job needs.
      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Run tests with coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run cover-go

      - name: Run tests with race detector
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-go-race

  # The matrix job reports as `test (ubuntu-24.04)` and `test (macos-15)`.
  # This job owns the plain name `test`, so the required-check list names
  # one check and stays stable when the matrix changes.
  test:
    name: test
    if: always()
    needs: test-matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [[ "${RESULT}" != "success" ]]; then
            echo "the test matrix finished as ${RESULT}" >&2
            exit 1
          fi

  # The Python suite is empty until the first app or package lands. test-py
  # passes while pytest collects nothing and fails on any real failure; the
  # lock check runs regardless.
  test-py:
    name: test-py
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pinned uv, which then provisions the interpreter and
      # restores the locked dependency closure from uv.lock.
      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: uv

      - name: Check that uv.lock matches pyproject.toml
        run: mise run lock-check

      - name: Run the Python tests
        run: mise run test-py

  # ansible-lint, the playbook syntax check, and the Molecule scenarios.
  # Molecule needs Docker, which the ubuntu-24.04 runner has. Nothing here
  # connects to a real host.
  ansible:
    name: ansible
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv provisions the interpreter and the locked ops group; bats and jq
      # run the ssh option tests.
      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: uv bats jq

      - name: Lint the Ansible tree
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run lint-ansible

      # The nested rootless daemon cannot load host kernel modules. Docker
      # needs bridge netfilter for the slot networks with enable_icc=false.
      - name: Load bridge netfilter for the isolated slot networks
        run: sudo modprobe br_netfilter

      - name: Run the Molecule scenarios
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "0"
        run: mise run test-ansible

  vuln:
    name: vuln
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Run govulncheck
        run: mise run vuln

  vendor-check:
    name: vendor-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.19
          install_args: go

      - name: Check vendor drift
        run: mise run vendor-check
